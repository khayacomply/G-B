  <!-- Lightbox CSS -->
  <style>
    /* Lightbox Overlay */
    .lightbox {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.95);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      opacity: 0;
      transition: opacity 0.3s ease;
      padding: 20px;
    }
    
    .lightbox.active {
      display: flex;
      opacity: 1;
    }
    
    /* Lightbox Content Wrapper */
    .lightbox-content {
      position: relative;
      max-width: 95%;
      max-height: 90vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .lightbox-content img {
      max-width: 100%;
      max-height: 85vh;
      border-radius: 10px;
      box-shadow: 0 0 30px rgba(198, 59, 154, 0.5);
      border: 3px solid var(--gold);
      object-fit: contain;
    }
    
    /* Close Button (X) - TOP RIGHT, always visible */
    .lightbox-close {
      position: absolute;
      top: 15px;
      right: 15px;
      color: var(--white);
      font-size: 2.5rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      z-index: 10000;
      background: rgba(0,0,0,0.6);
      width: 45px;
      height: 45px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    
    .lightbox-close:hover {
      color: var(--white);
      background: var(--pink);
      transform: scale(1.1);
    }
    
    /* Navigation Arrows - INSIDE image area, always visible */
    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: var(--white);
      font-size: 3rem;
      cursor: pointer;
      padding: 20px 15px;
      background: rgba(0,0,0,0.6);
      border-radius: 50%;
      transition: all 0.3s ease;
      z-index: 10000;
      user-select: none;
      line-height: 1;
    }
    
    .lightbox-nav:hover {
      background: var(--pink);
      color: var(--white);
      transform: translateY(-50%) scale(1.1);
    }
    
    .lightbox-prev { left: 15px; }
    .lightbox-next { right: 15px; }
    
    /* Image Counter */
    .lightbox-counter {
      position: absolute;
      bottom: -40px;
      left: 50%;
      transform: translateX(-50%);
      color: var(--white);
      font-size: 1rem;
      background: rgba(0,0,0,0.7);
      padding: 5px 15px;
      border-radius: 20px;
      white-space: nowrap;
    }
    
    /* Mobile Responsive */
    @media (max-width: 768px) {
      .lightbox-nav {
        font-size: 2.5rem;
        padding: 15px 12px;
      }
      .lightbox-prev { left: 10px; }
      .lightbox-next { right: 10px; }
      .lightbox-close {
        top: 10px;
        right: 10px;
        font-size: 2rem;
        width: 40px;
        height: 40px;
      }
      .lightbox-counter {
        bottom: -35px;
        font-size: 0.9rem;
      }
      .lightbox-content img {
        max-height: 75vh;
      }
    }
  </style>

<!-- Lightbox JavaScript -->
<script>
document.addEventListener('DOMContentLoaded', function() {
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const lightboxCounter = document.getElementById('lightboxCounter');
  const lightboxClose = document.getElementById('lightboxClose');
  const lightboxPrev = document.getElementById('lightboxPrev');
  const lightboxNext = document.getElementById('lightboxNext');
  const galleryItems = document.querySelectorAll('.gallery-item');
  
  let currentIndex = 0;
  
  // Build images array from gallery
  const images = Array.from(galleryItems).map(item => {
    const img = item.querySelector('img');
    return {
      src: img.src,
      alt: img.alt || 'Gallery Image'
    };
  });
  
  // Open lightbox when gallery item clicked
  galleryItems.forEach((item, index) => {
    item.addEventListener('click', function(e) {
      e.preventDefault();
      currentIndex = index;
      openLightbox(index);
    });
  });
  
  function openLightbox(index) {
    if (!images[index]) return;
    lightboxImg.src = images[index].src;
    lightboxImg.alt = images[index].alt;
    updateCounter();
    lightbox.classList.add('active');
    document.body.style.overflow = 'hidden'; // Prevent background scroll
  }
  
  function closeLightbox() {
    lightbox.classList.remove('active');
    document.body.style.overflow = '';
  }
  
  function updateCounter() {
    lightboxCounter.textContent = `${currentIndex + 1} / ${images.length}`;
  }
  
  function showPrev() {
    currentIndex = (currentIndex - 1 + images.length) % images.length;
    lightboxImg.src = images[currentIndex].src;
    lightboxImg.alt = images[currentIndex].alt;
    updateCounter();
  }
  
  function showNext() {
    currentIndex = (currentIndex + 1) % images.length;
    lightboxImg.src = images[currentIndex].src;
    lightboxImg.alt = images[currentIndex].alt;
    updateCounter();
  }
  
  // Event listeners
  lightboxClose.addEventListener('click', function(e) {
    e.stopPropagation();
    closeLightbox();
  });
  
  lightboxPrev.addEventListener('click', function(e) {
    e.stopPropagation();
    showPrev();
  });
  
  lightboxNext.addEventListener('click', function(e) {
    e.stopPropagation();
    showNext();
  });
  
  // Close on overlay click (but not on image or controls)
  lightbox.addEventListener('click', function(e) {
    if (e.target === lightbox) {
      closeLightbox();
    }
  });
  
  // Keyboard navigation
  document.addEventListener('keydown', function(e) {
    if (!lightbox.classList.contains('active')) return;
    
    if (e.key === 'Escape' || e.key === 'Esc') {
      closeLightbox();
    } else if (e.key === 'ArrowLeft') {
      showPrev();
    } else if (e.key === 'ArrowRight') {
      showNext();
    }
  });
  
  // Prevent image drag
  lightboxImg.addEventListener('dragstart', function(e) {
    e.preventDefault();
  });
});
</script>
